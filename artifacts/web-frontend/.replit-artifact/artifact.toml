kind = "web"
previewPath = "/"
title = "Silver Bullet"
version = "1.0.0"
id = "artifacts/web-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21854

[services.development]
run = "pnpm --filter @workspace/web-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web-frontend", "run", "build" ]
publicDir = "artifacts/web-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21854"
BASE_PATH = "/"
